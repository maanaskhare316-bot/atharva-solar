<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atharva Enterprises | Admin Portal</title>
  <meta name="robots" content="noindex, nofollow">
  
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23E5A93D'><circle cx='12' cy='12' r='4'/><path d='M12 2v2'/><path d='M12 20v2'/></svg>" type="image/svg+xml">
  
  <!-- Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="admin-body" style="background:#F8FAFC;color:#0F172A;min-height:100vh;font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;">

  <!-- ========================================================================= -->
  <!-- ADMIN AUTHENTICATION SCREEN                                               -->
  <!-- ========================================================================= -->
  <div id="admin-login-screen" class="admin-login-overlay" style="display:none;background:#0B1628;min-height:100vh;align-items:center;justify-content:center;padding:1.5rem;">
    <div class="admin-login-card" style="max-width:400px;width:100%;background:#FFFFFF;border-radius:10px;padding:2.25rem;box-shadow:0 20px 40px rgba(0,0,0,0.25);border:1px solid #E2E8F0;">
      <div style="text-align:center;margin-bottom:1.75rem;">
        <div style="width:44px;height:44px;background:#0B1628;color:#E5A93D;border-radius:8px;display:flex;align-items:center;justify-content:center;margin:0 auto 0.85rem;font-weight:800;font-size:1.1rem;">
          AE
        </div>
        <h2 style="font-family:'Plus Jakarta Sans',sans-serif;font-size:1.35rem;font-weight:700;color:#0B1628;margin-bottom:0.25rem;">Admin Sign In</h2>
        <p style="font-size:0.825rem;color:#64748B;">Atharva Enterprises &bull; Operations Portal</p>
      </div>

      <form id="admin-login-form" onsubmit="window.handleAdminLogin(event)">
        <div class="form-group" style="margin-bottom:1.15rem;">
          <label style="display:block;font-size:0.8rem;font-weight:600;color:#334155;margin-bottom:0.35rem;">Email Address</label>
          <input type="email" id="login-email" required placeholder="admin@atharvasolar.com" style="width:100%;padding:0.7rem 0.85rem;background:#FFFFFF;border:1px solid #CBD5E1;border-radius:6px;color:#0F172A;font-size:0.9rem;box-sizing:border-box;">
        </div>

        <div class="form-group" style="margin-bottom:1.35rem;">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.35rem;">
            <label style="font-size:0.8rem;font-weight:600;color:#334155;">Password</label>
            <button type="button" onclick="window.togglePasswordVisibility('login-password', this)" style="background:none;border:none;color:#0284C7;font-size:0.775rem;cursor:pointer;">Show</button>
          </div>
          <input type="password" id="login-password" required placeholder="••••••••••••" style="width:100%;padding:0.7rem 0.85rem;background:#FFFFFF;border:1px solid #CBD5E1;border-radius:6px;color:#0F172A;font-size:0.9rem;box-sizing:border-box;">
        </div>

        <button type="submit" class="btn btn-primary" style="width:100%;padding:0.75rem;background:#0B1628;color:#FFFFFF;font-weight:600;border:none;border-radius:6px;font-size:0.9rem;cursor:pointer;">
          Sign In
        </button>
      </form>

      <div style="text-align:center;margin-top:1.25rem;padding-top:1rem;border-top:1px solid #F1F5F9;">
        <a href="/" style="font-size:0.825rem;color:#64748B;text-decoration:none;">&larr; Back to Public Website</a>
      </div>
    </div>
  </div>

  <!-- ========================================================================= -->
  <!-- ADMIN PORTAL WRAPPER                                                      -->
  <!-- ========================================================================= -->
  <div id="admin-view-wrap" class="admin-view-wrap" style="display:none;background:#F8FAFC;min-height:100vh;">
    
    <!-- Minimalist Header -->
    <header style="background:#FFFFFF;border-bottom:1px solid #E2E8F0;padding:0.85rem 2rem;display:flex;justify-content:space-between;align-items:center;">
      <div style="display:flex;align-items:center;gap:1.25rem;">
        <a href="/" style="display:flex;align-items:center;gap:0.65rem;text-decoration:none;">
          <div style="width:34px;height:34px;background:#0B1628;color:#E5A93D;border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:0.95rem;">
            AE
          </div>
          <div>
            <span style="font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:1.05rem;color:#0B1628;">Atharva Enterprises</span>
            <span style="display:inline-block;margin-left:0.5rem;font-size:0.725rem;background:#F1F5F9;color:#475569;padding:2px 7px;border-radius:4px;font-weight:600;">Admin</span>
          </div>
        </a>
      </div>

      <div style="display:flex;align-items:center;gap:0.65rem;">
        <a href="/" target="_blank" class="btn btn-sm" style="background:#FFFFFF;color:#475569;border:1px solid #CBD5E1;padding:0.4rem 0.8rem;border-radius:6px;font-size:0.8rem;font-weight:500;text-decoration:none;display:inline-flex;align-items:center;gap:0.35rem;">
          View Public Site ↗
        </a>
        <button class="btn btn-sm" onclick="window.loadAndDisplayAppointments()" style="background:#FFFFFF;color:#0F172A;border:1px solid #CBD5E1;padding:0.4rem 0.8rem;border-radius:6px;font-size:0.8rem;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:0.35rem;">
          Refresh
        </button>
        <button class="btn btn-sm" onclick="window.adminLogout()" style="background:#FFFFFF;color:#DC2626;border:1px solid #FCA5A5;padding:0.4rem 0.8rem;border-radius:6px;font-size:0.8rem;font-weight:600;cursor:pointer;">
          Sign Out
        </button>
      </div>
    </header>

    <!-- Navigation Tabs -->
    <div style="background:#FFFFFF;border-bottom:1px solid #E2E8F0;padding:0 2rem;display:flex;gap:2rem;">
      <button class="admin-tab-btn active" data-tab="appointments" onclick="window.switchAdminTab('appointments')" style="background:none;border:none;padding:0.9rem 0.15rem;font-size:0.875rem;font-weight:600;color:#0B1628;cursor:pointer;border-bottom:2px solid #0B1628;display:inline-flex;align-items:center;gap:0.4rem;">
        Appointments
        <span id="nav-pending-badge" style="background:#FEF3C7;color:#92400E;font-size:0.7rem;padding:1px 6px;border-radius:10px;font-weight:700;display:none;">0</span>
      </button>
      <button class="admin-tab-btn" data-tab="leads" onclick="window.switchAdminTab('leads')" style="background:none;border:none;padding:0.9rem 0.15rem;font-size:0.875rem;font-weight:600;color:#64748B;cursor:pointer;border-bottom:2px solid transparent;display:inline-flex;align-items:center;gap:0.4rem;">
        Enquiries
      </button>
      <button class="admin-tab-btn" data-tab="security" onclick="window.switchAdminTab('security')" style="background:none;border:none;padding:0.9rem 0.15rem;font-size:0.875rem;font-weight:600;color:#64748B;cursor:pointer;border-bottom:2px solid transparent;display:inline-flex;align-items:center;gap:0.4rem;">
        Settings
      </button>
    </div>

    <!-- Main Content -->
    <main style="padding:1.5rem 2rem;max-width:1440px;margin:0 auto;">
      
      <!-- Minimalist Stats Overview -->
      <div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(200px, 1fr));gap:1rem;margin-bottom:1.5rem;">
        
        <div style="background:#FFFFFF;border:1px solid #E2E8F0;border-radius:8px;padding:1.1rem 1.25rem;">
          <div style="font-size:0.725rem;color:#64748B;font-weight:600;text-transform:uppercase;letter-spacing:0.04em;margin-bottom:0.25rem;">Pending Review</div>
          <div id="kpi-pending-count" style="font-size:1.6rem;font-weight:700;color:#D97706;font-family:'Plus Jakarta Sans',sans-serif;">0</div>
          <div style="font-size:0.725rem;color:#94A3B8;">Awaiting action</div>
        </div>

        <div style="background:#FFFFFF;border:1px solid #E2E8F0;border-radius:8px;padding:1.1rem 1.25rem;">
          <div style="font-size:0.725rem;color:#64748B;font-weight:600;text-transform:uppercase;letter-spacing:0.04em;margin-bottom:0.25rem;">Confirmed Meetings</div>
          <div id="kpi-confirmed-count" style="font-size:1.6rem;font-weight:700;color:#059669;font-family:'Plus Jakarta Sans',sans-serif;">0</div>
          <div style="font-size:0.725rem;color:#94A3B8;">Approved with link</div>
        </div>

        <div style="background:#FFFFFF;border:1px solid #E2E8F0;border-radius:8px;padding:1.1rem 1.25rem;">
          <div style="font-size:0.725rem;color:#64748B;font-weight:600;text-transform:uppercase;letter-spacing:0.04em;margin-bottom:0.25rem;">Total Bookings</div>
          <div id="kpi-total-appointments" style="font-size:1.6rem;font-weight:700;color:#0284C7;font-family:'Plus Jakarta Sans',sans-serif;">0</div>
          <div style="font-size:0.725rem;color:#94A3B8;">All time requests</div>
        </div>

        <div style="background:#FFFFFF;border:1px solid #E2E8F0;border-radius:8px;padding:1.1rem 1.25rem;">
          <div style="font-size:0.725rem;color:#64748B;font-weight:600;text-transform:uppercase;letter-spacing:0.04em;margin-bottom:0.25rem;">Contact Enquiries</div>
          <div id="kpi-total-enquiries" style="font-size:1.6rem;font-weight:700;color:#475569;font-family:'Plus Jakarta Sans',sans-serif;">0</div>
          <div style="font-size:0.725rem;color:#94A3B8;">Form submissions</div>
        </div>

      </div>

      <!-- Tab Content Area -->
      <div id="admin-tab-content">
        <!-- Rendered dynamically by admin.js -->
      </div>

    </main>

  </div>

  <!-- Modal and Toast Container -->
  <div id="generic-modal" class="modal-overlay">
    <div class="modal-dialog" style="background:#FFFFFF;color:#0F172A;border-radius:10px;max-width:520px;box-shadow:0 20px 40px rgba(0,0,0,0.15);padding:1.75rem;border:1px solid #E2E8F0;">
      <button class="modal-close-btn" onclick="window.closeModal()" aria-label="Close modal">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
      <div id="generic-modal-content"></div>
    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>

  <!-- Scripts -->
  <script src="/js/icons.js"></script>
  <script src="/js/brands.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
